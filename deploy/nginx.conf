# CodeViz — nginx site config (host nginx).
# Serves the built frontend and reverse-proxies the API + Socket.io to the
# Node backend running on 127.0.0.1:5001.
#
#   1. Build the frontend:  cd frontend && VITE_API_URL=https://YOURDOMAIN npm run build
#   2. Copy dist to the web root:  sudo cp -r frontend/dist/* /var/www/codeviz/
#   3. Put this file at /etc/nginx/sites-available/codeviz and symlink to sites-enabled
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. HTTPS:  sudo certbot --nginx -d YOURDOMAIN   (auto-rewrites this to 443)

upstream codeviz_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;   # <-- change

    # Frontend static (built SPA)
    root /var/www/codeviz;
    index index.html;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API + execution + realtime -> Node backend ---
    location ~ ^/(api|run|trace)/ {
        proxy_pass http://codeviz_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;            # code execution can be slow
    }
    # exact /run and /trace (no trailing segment)
    location = /run  { proxy_pass http://codeviz_backend; proxy_set_header Host $host; proxy_read_timeout 120s; }
    location = /trace{ proxy_pass http://codeviz_backend; proxy_set_header Host $host; proxy_read_timeout 120s; }

    # Socket.io (websocket upgrade)
    location /socket.io/ {
        proxy_pass http://codeviz_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — everything else serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets aggressively (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
